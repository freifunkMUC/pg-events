name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.26', '1.27' ]

    # The tests talk to a real Postgres: LISTEN/NOTIFY, triggers and advisory
    # locks cannot be faked meaningfully.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
        cache: true

    - name: Build
      run: go build -v ./...

    - name: Build example
      working-directory: example
      run: go build -v ./...

    # Known vulnerabilities in the dependencies and in the standard library
    # this is built with. It reports only what the code actually reaches.
    - name: Vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    - name: Test
      env:
        PGEVENTS_TEST_DATABASE_URL: postgres://postgres:development@localhost:5432/postgres?sslmode=disable
      run: go test -race -v ./...
